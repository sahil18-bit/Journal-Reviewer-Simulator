[build-system]
requires = ["setuptools>=65,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-reviewer-simulator"
version = "0.1.0"
description = "Evidence-grounded journal reviewer simulator API foundation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: isolated unit tests",
    "api: API behavior tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
